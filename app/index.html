<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ragdoll-mail</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app" class="app" hidden>
  <aside class="side">
    <header class="side-top">
      <button class="icon-btn" id="side-btn"></button>
      <div class="grow pywebview-drag-region"></div>
      <button class="icon-btn" id="compose-btn" data-tip="compose"></button>
    </header>
    <nav class="nav" id="nav"></nav>
    <div class="grow"></div>
    <button class="update-pill" id="update" hidden></button>
    <button class="icon-btn account" id="account"><span class="i" data-i="circle-user-round"></span></button>
    <div class="side-grip" id="side-grip"></div>
  </aside>
  <div class="side-scrim" id="side-scrim"></div>

  <section class="list-col" id="list-col">
    <header class="list-head">
      <div class="head-drag pywebview-drag-region"></div>
      <div class="head-drag low pywebview-drag-region"></div>
      <button class="here-btn" id="here-btn"></button>
      <div class="head-title pywebview-drag-region" id="head-title" dir="auto"></div>
      <label class="search">
        <span class="i" data-i="search"></span>
        <input id="search" type="text" spellcheck="false" autocomplete="off">
        <button class="icon-btn tiny" id="search-clear" hidden></button>
      </label>
      <button class="icon-btn" id="search-btn"></button>
      <button class="icon-btn" id="filter-btn"></button>
    </header>
    <div class="banner" id="banner" hidden>
      <span class="i" data-i="triangle-alert"></span>
      <span class="banner-text" id="banner-text"></span>
      <button class="link-btn" id="banner-btn"></button>
    </div>
    <div class="rows" id="rows" tabindex="0"></div>
  </section>

  <div class="splitter" id="splitter"></div>

  <main class="reader" id="reader">
    <header class="toolbar" id="toolbar">
      <div class="tools" id="tools"></div>
      <div class="grow pywebview-drag-region"></div>
      <div class="tools" id="tools-end"></div>
    </header>
    <div class="pane" id="pane"></div>
  </main>
</div>

<div id="setup" class="setup" hidden></div>
<div id="layer"></div>
<div id="toasts" class="toasts"></div>
</body>
</html>
