[project]
name = "ragdoll-mail"
version = "0.8.4"
description = "Free mail app for Mac and Windows with fast local search for any IMAP mailbox, plus a command line for AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
app = ["pywebview>=5", "pyobjc-framework-UserNotifications; sys_platform == 'darwin'"]

[project.scripts]
ragdoll = "ragdoll:main"

[tool.setuptools]
py-modules = ["ragdoll", "hmail"]
