[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdoll-mail"
version = "0.12.0"
description = "Your IMAP mailbox from the terminal, for you and AI agents: local search, reply drafts, checks before sending"
readme = "packaging/pypi.md"
requires-python = ">=3.10"
authors = [{name = "Eric Tan"}]
keywords = ["email", "imap", "mail client", "full-text search", "exmail", "cli", "ai agent"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email :: Email Clients (MUA)",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://erict16.github.io/ragdoll-mail/"
Source = "https://github.com/erict16/ragdoll-mail"
Releases = "https://github.com/erict16/ragdoll-mail/releases"

[project.scripts]
ragdoll = "ragdoll:main"

[tool.setuptools]
py-modules = ["ragdoll", "hmail"]
