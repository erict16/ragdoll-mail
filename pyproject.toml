[project]
name = "ragdoll-mail"
version = "0.6.0"
description = "Mail CLI for one IMAP/SMTP mailbox with a local search index, built for AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
app = ["pywebview>=5"]

[project.scripts]
ragdoll = "ragdoll:main"

[tool.setuptools]
py-modules = ["ragdoll", "hmail"]
