name: site

# The website (site/) on GitHub Pages: https://erict16.github.io/ragdoll-mail/
# The pages are made by site/build.py and kept in the repo, so this only publishes them.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the pages are up to date
        run: python3 site/build.py && git diff --exit-code -- site
      - name: Leave out what the site does not serve
        run: rm site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
