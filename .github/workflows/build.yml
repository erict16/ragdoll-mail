name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller pillow
      - run: pyinstaller --noconfirm ragdoll-mail.spec
      - name: Make the .dmg
        run: |
          mkdir -p dmg && cp -R dist/ragdoll-mail.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname ragdoll-mail -srcfolder dmg -ov -format UDZO ragdoll-mail-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ragdoll-mail-mac.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller pillow
      - run: pyinstaller --noconfirm ragdoll-mail.spec
      - run: Compress-Archive -Path dist/ragdoll-mail.exe -DestinationPath ragdoll-mail-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ragdoll-mail-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ragdoll-mail-mac.dmg
            ragdoll-mail-windows.zip
          generate_release_notes: true
