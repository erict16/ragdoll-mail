name: build

on:
  push:
    tags: ["v*"]
  pull_request:          # tests only; the builds run for tags and by hand
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Tag builds go straight to the GitHub release, so they use no artifact storage.
# Manual runs keep the files as short-lived artifacts (1 day).

jobs:
  test:
    # all three systems: ragdoll update keeps a new version only when its tests pass on that system
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      # verify timezone-sensitive tests on Windows with tzdata installed (as the shipped app bundles it)
      - if: runner.os == 'Windows'
        run: pip install tzdata && python -m unittest tests/test_group_f.py tests/test_audit_fixes.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make the release
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  mac:
    needs: [test, release]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.release.result != 'failure' }}
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller pillow pyobjc-framework-UserNotifications
      - run: pyinstaller --noconfirm ragdoll-mail.spec
      - name: Make the .dmg
        run: |
          mkdir -p dmg && cp -R "dist/Ragdoll Mail.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Ragdoll Mail" -srcfolder dmg -ov -format UDZO ragdoll-mail-mac.dmg
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" ragdoll-mail-mac.dmg --clobber -R "$GITHUB_REPOSITORY"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ragdoll-mail-mac.dmg
          retention-days: 1

  windows:
    needs: [test, release]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.release.result != 'failure' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller pillow tzdata   # Windows has no time zone database of its own (invites)
      - run: pyinstaller --noconfirm ragdoll-mail.spec
      - run: Compress-Archive -Path "dist/Ragdoll Mail.exe", "dist/ragdoll.exe" -DestinationPath ragdoll-mail-windows.zip
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (python -c "import ragdoll; print(ragdoll.__version__)").Trim()
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" packaging/windows/ragdoll-mail.iss
          Copy-Item dist/ragdoll-mail-windows-setup.exe ragdoll-mail-windows-setup.exe
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ragdoll-mail-windows.zip ragdoll-mail-windows-setup.exe --clobber -R "$GITHUB_REPOSITORY"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ragdoll-mail-windows.zip
            ragdoll-mail-windows-setup.exe
          retention-days: 1

  # Off until PyPI trusted publishing is set up and the repo variable PYPI is "on"
  # (see packaging/README.md).
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI == 'on'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
