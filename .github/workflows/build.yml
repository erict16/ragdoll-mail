name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Tag builds go straight to the GitHub release, so they use no artifact storage.
# Manual runs keep the files as short-lived artifacts (1 day).

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make the release
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  mac:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' }}
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller pillow pyobjc-framework-UserNotifications
      - run: pyinstaller --noconfirm ragdoll-mail.spec
      - name: Make the .dmg
        run: |
          mkdir -p dmg && cp -R "dist/Ragdoll Mail.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Ragdoll Mail" -srcfolder dmg -ov -format UDZO ragdoll-mail-mac.dmg
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" ragdoll-mail-mac.dmg --clobber -R "$GITHUB_REPOSITORY"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ragdoll-mail-mac.dmg
          retention-days: 1

  windows:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller pillow
      - run: pyinstaller --noconfirm ragdoll-mail.spec
      - run: Compress-Archive -Path "dist/Ragdoll Mail.exe", "dist/ragdoll.exe" -DestinationPath ragdoll-mail-windows.zip
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ragdoll-mail-windows.zip --clobber -R "$GITHUB_REPOSITORY"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ragdoll-mail-windows.zip
          retention-days: 1

  checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Add SHA256SUMS.txt to the release (packaging/bump.py reads it)
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "ragdoll-mail-*"
          sha256sum ragdoll-mail-* > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"

  # Off until PyPI trusted publishing is set up and the repo variable PYPI is "on"
  # (see packaging/README.md).
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI == 'on'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
