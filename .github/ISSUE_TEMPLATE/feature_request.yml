name: Feature request
description: Ask for something ragdoll does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Command line, Desktop app, Both]
